<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17324d">

<title>Port 2026 · Itinerary</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #f3f5f7;
  color: #18222c;
}

.app {
  max-width: 520px;
  margin: auto;
  min-height: 100vh;
  background: white;
}

.header {
  background: #17324d;
  color: white;
  padding: 28px 22px 24px;
}

.back {
  display: inline-block;
  color: white;
  text-decoration: none;
  font-size: 14px;
  margin-bottom: 22px;
  opacity: .85;
}

.label {
  font-size: 11px;
  letter-spacing: 1.6px;
  opacity: .7;
}

h1 {
  margin: 6px 0;
  font-size: 34px;
}

.trip-date {
  font-size: 14px;
  opacity: .8;
}

.content {
  padding: 22px;
}

/* DAY SELECTOR */

.day-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 26px;
}

.day-tab {
  border: none;
  padding: 12px 5px;
  border-radius: 12px;
  background: #eef1f3;
  font-weight: 600;
  cursor: pointer;
}

.day-tab.active {
  background: #17324d;
  color: white;
}

/* DAY */

.day {
  display: none;
}

.day.active {
  display: block;
}

.day-heading {
  margin-bottom: 20px;
}

.day-number {
  font-size: 12px;
  font-weight: 700;
  color: #70808b;
  letter-spacing: 1px;
}

.day-title {
  margin-top: 4px;
  font-size: 25px;
  font-weight: 750;
}

/* ACTIVITY */

.activity {
  display: grid;
  grid-template-columns: 75px 1fr;
  gap: 12px;
  position: relative;
}

.time {
  font-size: 12px;
  font-weight: 700;
  color: #65727b;
  padding-top: 4px;
}

.event {
  border-left: 2px solid #e3e8eb;
  padding: 0 0 25px 18px;
  position: relative;
}

.event::before {
  content: "";
  position: absolute;
  left: -6px;
  top: 4px;
  width: 10px;
  height: 10px;
  background: #17324d;
  border-radius: 50%;
  border: 2px solid white;
}

.event-icon {
  font-size: 20px;
  margin-bottom: 5px;
}

.event-title {
  font-size: 16px;
  font-weight: 700;
}

.event-note {
  margin-top: 5px;
  font-size: 13px;
  line-height: 1.45;
  color: #68747c;
}

.address {
  margin-top: 8px;
  font-size: 12px;
  line-height: 1.45;
  color: #68747c;
}

/* BUTTONS */

.actions {
  margin-top: 11px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.map-button {
  display: inline-block;
  text-decoration: none;
  color: #17324d;
  background: #edf4f7;
  padding: 8px 11px;
  border-radius: 9px;
  font-size: 12px;
  font-weight: 700;
}

/* TBD */

.tbd {
  background: #f5f6f7;
  padding: 17px;
  border-radius: 15px;
  color: #68747c;
  font-size: 13px;
}

/* WEATHER WARNING */

.weather-note {
  display: inline-block;
  margin-top: 7px;
  padding: 5px 8px;
  background: #fff4d8;
  border-radius: 7px;
  font-size: 11px;
  color: #735d20;
}

/* FOOTER */

.footer {
  text-align: center;
  color: #a0a5a9;
  font-size: 11px;
  padding: 15px 0 30px;
}

</style>
</head>

<body>

<div class="app">

<header class="header">

<a class="back" href="index.html">
  ← Port 2026
</a>

<div class="label">
  OUR TRIP
</div>

<h1>Itinerary</h1>

<div class="trip-date">
  3 — 5 October 2026
</div>

</header>


<main class="content">

<div class="day-tabs">

<button class="day-tab active"
onclick="showDay(1)">
Day 1
</button>

<button class="day-tab"
onclick="showDay(2)">
Day 2
</button>

<button class="day-tab"
onclick="showDay(3)">
Day 3
</button>

</div>


<!-- DAY 1 -->

<section class="day active" id="day1">

<div class="day-heading">
<div class="day-number">DAY 1</div>
<div class="day-title">Saturday · 3 October</div>
</div>
<div id="day1-activities"></div>

<button
  class="add-activity-button"
  onclick="openAddActivity(1)">
  ＋ Add activity
</button>

</section>


<!-- DAY 2 -->

<section class="day" id="day2">

<div class="day-heading">
<div class="day-number">DAY 2</div>
<div class="day-title">Sunday · 4 October</div>
</div>

<div id="day2-activities"></div>

<button
  class="add-activity-button"
  onclick="openAddActivity(2)">
  ＋ Add activity
</button>

</section>

<!-- DAY 3 -->

<section class="day" id="day3">

<div class="day-heading">
<div class="day-number">DAY 3</div>
<div class="day-title">Monday · 5 October</div>
</div>

<div id="day3-activities"></div>

<button
  class="add-activity-button"
  onclick="openAddActivity(3)">
  ＋ Add activity
</button>

</section>

<div class="footer">
Port 2026 · Our Labour Day getaway
</div>

</main>

</div>

<script>

let itineraryItems = [];


/* =========================
   DAY TABS
========================= */

function showDay(dayNumber) {

  const days =
    document.querySelectorAll(".day");

  const tabs =
    document.querySelectorAll(".day-tab");

  days.forEach(day =>
    day.classList.remove("active")
  );

  tabs.forEach(tab =>
    tab.classList.remove("active")
  );

  document
    .getElementById("day" + dayNumber)
    .classList.add("active");

  tabs[dayNumber - 1]
    .classList.add("active");
}


/* =========================
   LOAD ITINERARY FROM D1
========================= */

async function loadItinerary() {

  try {

    const response =
      await fetch("/api/itinerary");

    const data =
      await response.json();

    if (!data.success) {
      throw new Error(
        data.error ||
        "Could not load itinerary."
      );
    }

    itineraryItems =
      data.items || [];

    renderItinerary();

  }

  catch (error) {

    console.error(error);

    document
      .querySelectorAll(
        '[id$="-activities"]'
      )
      .forEach(container => {

        container.innerHTML = `
          <div class="tbd">
            Could not load itinerary.
          </div>
        `;

      });
  }
}


/* =========================
   RENDER ALL DAYS
========================= */

function renderItinerary() {

  for (
    let dayNumber = 1;
    dayNumber <= 3;
    dayNumber++
  ) {

    const container =
      document.getElementById(
        "day" +
        dayNumber +
        "-activities"
      );

    if (!container) continue;

    const dayItems =
      itineraryItems.filter(
        item =>
          Number(item.day) ===
          dayNumber
      );

    if (dayItems.length === 0) {

      container.innerHTML = `
        <div class="tbd">
          🌴 Nothing planned yet.<br><br>
          Add an activity when you're ready.
        </div>
      `;

      continue;
    }


    container.innerHTML =
      dayItems
        .map(item =>
          createActivityHTML(item)
        )
        .join("");
  }
}


/* =========================
   CREATE ACTIVITY CARD
========================= */

function createActivityHTML(item) {

  const time =
    escapeHTML(item.time || "");

  const title =
    escapeHTML(item.title || "");

  const details =
    escapeHTML(item.details || "");

  const location =
    escapeHTML(item.location || "");


  let extraHTML = "";


  if (details) {

    extraHTML += `
      <div class="event-note">
        ${details}
      </div>
    `;
  }


  if (location) {

    const encodedLocation =
      encodeURIComponent(
        item.location
      );

    extraHTML += `
      <div class="address">
        ${location}
      </div>

      <div class="actions">

        <a
          class="map-button"
          href="https://www.google.com/maps/search/?api=1&query=${encodedLocation}"
          target="_blank">
          Map ↗
        </a>

        <a
          class="map-button"
          href="https://www.google.com/maps/dir/?api=1&destination=${encodedLocation}"
          target="_blank">
          Navigate ↗
        </a>

      </div>
    `;
  }


  return `
    <div class="activity">

      <div class="time">
        ${time}
      </div>

      <div class="event">

        <div class="event-icon">
          ${getActivityIcon(item.title)}
        </div>

        <div class="event-title">
          ${title}
        </div>

        ${extraHTML}

      </div>

    </div>
  `;
}


/* =========================
   ACTIVITY ICON
========================= */

function getActivityIcon(title) {

  const text =
    String(title || "")
      .toLowerCase();

  if (
    text.includes("breakfast") ||
    text.includes("brunch") ||
    text.includes("coffee")
  ) return "☕";

  if (
    text.includes("lunch") ||
    text.includes("dinner")
  ) return "🍽️";

  if (
    text.includes("beach")
  ) return "🏖️";

  if (
    text.includes("airbnb") ||
    text.includes("check")
  ) return "🏡";

  if (
    text.includes("clean")
  ) return "🧹";

  if (
    text.includes("tomato") ||
    text.includes("strawberry")
  ) return "🍓";

  if (
    text.includes("wildnets") ||
    text.includes("adventure")
  ) return "🌳";

  if (
    text.includes("leave") ||
    text.includes("arrive") ||
    text.includes("drive")
  ) return "🚙";

  return "📍";
}


/* =========================
   SAFE TEXT
========================= */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================
   ADD ACTIVITY
   We connect this next
========================= */

function openAddActivity(dayNumber) {

  alert(
    "Add activity for Day " +
    dayNumber +
    " is ready for the next step."
  );
}


/* =========================
   START
========================= */

loadItinerary();

</script>


</body>
</html>
